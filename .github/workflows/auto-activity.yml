name: Auto Activity Workflow

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  activity:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_ACTIVITY_TOKEN }}

      - name: Create Issue
        env:
          GH_TOKEN: ${{ secrets.MY_ACTIVITY_TOKEN }}
        run: |
          gh issue create --title "Daily algorithm practice: $(date +'%Y-%m-%d')" --body "Tracking daily tasks and progress."

      - name: Create Branch, Commit and PR
        env:
          GH_TOKEN: ${{ secrets.MY_ACTIVITY_TOKEN }}
        run: |
          git config user.name "TarasTTN"
          git config user.email "pchackukla@gmail.com"
          
          BRANCH_NAME="daily-sync-$(date +'%s')"
          git checkout -b "$BRANCH_NAME"
          
          echo "Automated sync at $(date)" >> activity.log
          git add activity.log
          git commit -m "chore: record daily progress [skip ci]"
          git push origin "$BRANCH_NAME"
          
          gh pr create --title "Sync daily progress: $(date +'%Y-%m-%d')" --body "Automated daily PR" --base main --head "$BRANCH_NAME"
